<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Arial,sans-serif">
  <title id="t">How Valora fits together</title>
  <desc id="d">You use the Valora app on the web or a phone. The app talks to Supabase, which holds your data behind Row Level Security. Edge Functions fetch prices from PriceCharting, the Steam store, CheapShark and UPCitemdb. A daily job checks your wishlist price alerts. The website is hosted on Vercel and every change is checked by GitHub Actions.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15121F"/></marker>
    <pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#15121F" opacity=".08"/></pattern>
  </defs>
  <rect width="960" height="540" fill="#F4F0E4"/><rect width="960" height="540" fill="url(#h)"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="900" fill="#15121F">You add a game. The rest happens by itself.</text>

  <!-- You -->
  <g transform="translate(40 190)"><rect x="6" y="6" width="190" height="120" fill="#FFC247" stroke="#15121F" stroke-width="3"/><rect width="190" height="120" fill="#fff" stroke="#15121F" stroke-width="3"/>
    <text x="95" y="48" text-anchor="middle" font-size="20" font-weight="900" fill="#15121F">You</text>
    <text x="95" y="74" text-anchor="middle" font-size="14" fill="#15121F">The Valora app</text>
    <text x="95" y="96" text-anchor="middle" font-size="12" fill="#5A5566">web, iPhone, Android</text></g>

  <!-- Supabase -->
  <g transform="translate(330 120)"><rect x="6" y="6" width="220" height="130" fill="#3ECF8E" stroke="#15121F" stroke-width="3"/><rect width="220" height="130" fill="#fff" stroke="#15121F" stroke-width="3"/>
    <text x="110" y="40" text-anchor="middle" font-size="18" font-weight="900" fill="#15121F">Your data</text>
    <text x="110" y="64" text-anchor="middle" font-size="13" fill="#15121F">Supabase database</text>
    <text x="110" y="86" text-anchor="middle" font-size="12" fill="#5A5566">locked per person</text>
    <text x="110" y="104" text-anchor="middle" font-size="12" fill="#5A5566">(Row Level Security)</text></g>

  <!-- Edge functions -->
  <g transform="translate(330 300)"><rect x="6" y="6" width="220" height="130" fill="#FF5A8A" stroke="#15121F" stroke-width="3"/><rect width="220" height="130" fill="#fff" stroke="#15121F" stroke-width="3"/>
    <text x="110" y="40" text-anchor="middle" font-size="18" font-weight="900" fill="#15121F">Price lookups</text>
    <text x="110" y="64" text-anchor="middle" font-size="13" fill="#15121F">Edge Functions</text>
    <text x="110" y="86" text-anchor="middle" font-size="12" fill="#5A5566">checks who you are,</text>
    <text x="110" y="104" text-anchor="middle" font-size="12" fill="#5A5566">limits 60 asks an hour</text></g>

  <!-- Sources -->
  <g transform="translate(650 90)" font-size="13" fill="#15121F">
    <rect x="5" y="5" width="260" height="46" fill="#38E1FF" stroke="#15121F" stroke-width="3"/><rect width="260" height="46" fill="#fff" stroke="#15121F" stroke-width="3"/><text x="130" y="29" text-anchor="middle" font-weight="900">PriceCharting</text>
    <g transform="translate(0 66)"><rect x="5" y="5" width="260" height="46" fill="#38E1FF" stroke="#15121F" stroke-width="3"/><rect width="260" height="46" fill="#fff" stroke="#15121F" stroke-width="3"/><text x="130" y="29" text-anchor="middle" font-weight="900">Steam store</text></g>
    <g transform="translate(0 132)"><rect x="5" y="5" width="260" height="46" fill="#38E1FF" stroke="#15121F" stroke-width="3"/><rect width="260" height="46" fill="#fff" stroke="#15121F" stroke-width="3"/><text x="130" y="29" text-anchor="middle" font-weight="900">CheapShark</text></g>
    <g transform="translate(0 198)"><rect x="5" y="5" width="260" height="46" fill="#38E1FF" stroke="#15121F" stroke-width="3"/><rect width="260" height="46" fill="#fff" stroke="#15121F" stroke-width="3"/><text x="130" y="29" text-anchor="middle" font-weight="900">UPCitemdb (barcodes)</text></g>
  </g>
  <text x="780" y="76" text-anchor="middle" font-size="12" fill="#5A5566">Public price sources</text>

  <!-- Alerts -->
  <g transform="translate(650 400)"><rect x="5" y="5" width="260" height="96" fill="#FFC247" stroke="#15121F" stroke-width="3"/><rect width="260" height="96" fill="#fff" stroke="#15121F" stroke-width="3"/>
    <text x="130" y="36" text-anchor="middle" font-size="15" font-weight="900" fill="#15121F">Daily price alert check</text>
    <text x="130" y="60" text-anchor="middle" font-size="12" fill="#5A5566">reads your wishlist and finds games that</text>
    <text x="130" y="78" text-anchor="middle" font-size="12" fill="#5A5566">reached your target price</text></g>

  <!-- Hosting -->
  <g transform="translate(40 360)"><rect x="5" y="5" width="190" height="86" fill="#fff" stroke="#15121F" stroke-width="3"/><rect width="190" height="86" fill="#fff" stroke="#15121F" stroke-width="3"/>
    <text x="95" y="34" text-anchor="middle" font-size="14" font-weight="900" fill="#15121F">Vercel hosts the website</text>
    <text x="95" y="58" text-anchor="middle" font-size="12" fill="#5A5566">GitHub Actions checks</text>
    <text x="95" y="74" text-anchor="middle" font-size="12" fill="#5A5566">every change first</text></g>

  <!-- arrows -->
  <g stroke="#15121F" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M236 230 L326 190"/>
    <path d="M236 270 L326 350"/>
    <path d="M440 298 L440 254" marker-start="url(#a)"/>
    <path d="M556 330 L646 120"/>
    <path d="M556 340 L646 190"/>
    <path d="M556 350 L646 256"/>
    <path d="M556 360 L646 322"/>
  </g>
  <g font-size="12" fill="#15121F" font-weight="700">
    <text x="244" y="206" transform="rotate(-22 244 206)">1 · you add a game</text>
    <text x="226" y="316" transform="rotate(37 226 316)">2 · price lookup</text>
    <text x="428" y="282" text-anchor="end">3 · saved with the date</text>
  </g>
</svg>
