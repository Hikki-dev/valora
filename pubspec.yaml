name: valora
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.2.4
  font_awesome_flutter: ^11.0.0
  go_router: ^17.2.0
  google_fonts: ^8.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.12.2
  google_sign_in: ^6.2.1
  uuid: ^4.5.3
  flutter_animate: ^4.5.2
  mobile_scanner: ^6.0.3
  screenshot: ^3.0.0
  share_plus: ^10.1.1
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  web: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/Tatsumaki.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true



flutter:
  uses-material-design: true
  assets:
    - .env
