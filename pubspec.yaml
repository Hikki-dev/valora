name: valora
description: "Personal game collection valuation tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Supabase
  supabase_flutter: ^2.12.2

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # UI & Animation
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  font_awesome_flutter: ^10.8.0

  # Charts
  fl_chart: ^0.70.2

  # Images
  cached_network_image: ^3.4.1

  # Auth
  google_sign_in: ^6.2.1

  # Device & Platform
  package_info_plus: ^8.1.1
  shared_preferences: ^2.3.5
  path_provider: ^2.1.4

  # Scanner
  mobile_scanner: ^5.2.3

  # Sharing
  screenshot: ^3.0.0
  share_plus: ^10.0.2

  # Networking
  http: ^1.6.0
  web: ^1.1.0

  # Utils
  uuid: ^4.5.3
  url_launcher: ^6.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/Tatsumaki.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true



flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Regular.ttf
          weight: 400
        - asset: assets/fonts/Syne-Medium.ttf
          weight: 500
        - asset: assets/fonts/Syne-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
