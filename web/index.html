<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Valora - Premium Game Collection Tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Valora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Valora</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0A0A0F;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #valora-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
      background: radial-gradient(circle at center, #1A1A24 0%, #0A0A0F 100%);
    }

    #logo-container {
      width: 180px;
      height: 180px;
      background-image: url('assets/icon/Spalsh.webp');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      animation: pulse 2.5s infinite ease-in-out;
      filter: drop-shadow(0 0 15px rgba(245, 166, 35, 0.2));
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.1)); }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 30px rgba(245, 166, 35, 0.4)); }
      100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.1)); }
    }

    .shimmer-text {
      color: white;
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      letter-spacing: 8px;
      margin-top: 32px;
      font-size: 12px;
      opacity: 0.4;
      text-transform: uppercase;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="valora-splash">
    <div id="logo-container"></div>
    <div class="shimmer-text">Initializing Collection</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    function removeSplash() {
      const splash = document.getElementById('valora-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }

    const fallbackTimer = setTimeout(removeSplash, 10000);

    window.addEventListener('flutter-first-frame', function() {
      clearTimeout(fallbackTimer);
      removeSplash();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }
  </script>
</body>
</html>
