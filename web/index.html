<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Valora - Premium Game Collection Tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Valora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Valora</title>
  
  <!-- Content Security Policy for Flutter Web (CanvasKit & Blobs) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://www.gstatic.com https://unpkg.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*; connect-src 'self' blob: https://* wss://*; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com;">

  <!-- Standard Web Fonts via Google Fonts API (High Performance) -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0A0A0F;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #valora-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Desktop View: Optimized Batman Splash */
    @media (min-width: 769px) {
      #valora-splash {
        background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('assets/icon/batman_optimized.jpg');
      }
    }

    /* Mobile View: Standard Splash */
    @media (max-width: 768px) {
      #valora-splash {
        background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('assets/icon/Splash.webp');
      }
    }

    .shimmer-text {
      color: white;
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      letter-spacing: 8px;
      margin-top: 32px;
      font-size: 14px;
      opacity: 0.8;
      text-transform: uppercase;
      z-index: 10;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="valora-splash">
    <div class="shimmer-text">Initializing Collection</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    function removeSplash() {
      const splash = document.getElementById('valora-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }

    const fallbackTimer = setTimeout(removeSplash, 10000);

    window.addEventListener('flutter-first-frame', function() {
      clearTimeout(fallbackTimer);
      removeSplash();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }
  </script>
</body>
</html>
