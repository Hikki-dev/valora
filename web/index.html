<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0A12">
  <meta name="description" content="Valora - Premium Game Collection Tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Valora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Valora</title>

  <!-- CSP is enforced by the response headers in vercel.json (single source of truth). -->
  <!-- Fonts are bundled in the app (assets/fonts), so no render-blocking Google Fonts request here. -->

  <link rel="manifest" href="manifest.json">

  <!-- Splash is pure CSS: it paints on the very first frame, before any JS/WASM/image downloads. -->
  <style>
    html, body {
      background-color: #0B0A12;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #valora-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 28px;
      background-color: #0B0A12;
      background-image: repeating-conic-gradient(from 0deg at 50% 44%, rgba(244,239,230,.07) 0 2deg, transparent 2deg 9deg);
      color: #F4EFE6;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity .25s ease-out;
    }

    #valora-splash .mark {
      position: relative;
      width: 120px;
      height: 120px;
      transform: rotate(-6deg);
    }
    #valora-splash .mark::before {
      content: '';
      position: absolute;
      inset: 0;
      transform: translate(8px, 8px);
      background: #FFC247;
    }
    #valora-splash .mark span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0A12;
      border: 4px solid #F4EFE6;
      font-size: 78px;
      font-weight: 900;
      line-height: 1;
    }

    #valora-splash .title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: .14em;
    }

    #valora-splash .bar {
      width: 240px;
      height: 12px;
      transform: skewX(-14deg);
      background: #2C2842;
      overflow: hidden;
    }
    #valora-splash .bar i {
      display: block;
      height: 100%;
      width: 40%;
      background: #FFC247;
      animation: valora-slide 1.1s ease-in-out infinite;
    }
    @keyframes valora-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #valora-splash .bar i { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="valora-splash" role="status" aria-live="polite">
    <div class="mark"><span>V</span></div>
    <div class="title">VALORA</div>
    <div class="bar"><i></i></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    function removeSplash() {
      var splash = document.getElementById('valora-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 300);
      }
    }

    // Safety net only: normally removed by the 'flutter-first-frame' event.
    var fallbackTimer = setTimeout(removeSplash, 8000);

    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(fallbackTimer);
      removeSplash();
    });

    // Reload once when a *new* service worker takes over an already-controlled page.
    // On the very first visit the worker claims the page too (controller null -> set);
    // reloading then would download the whole app twice.
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController) window.location.reload();
        hadController = true;
      });
    }
  </script>
</body>
</html>
