name: Android Release Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Get Version from pubspec
        id: get_version
        run: |
          FULL_VERSION=$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2)
          echo "VERSION=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG_EXISTS=$(git ls-remote --tags origin refs/tags/${{ steps.get_version.outputs.TAG }} | wc -l)
          if [ "$TAG_EXISTS" -ne 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
          --dart-define=APP_VERSION=${{ steps.get_version.outputs.VERSION }}

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Valora Build ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Automated Release: ${{ steps.get_version.outputs.VERSION }}
            This is a production-ready build of Valora, automatically generated from the latest push to `main`.
            
            ### Installation:
            1. Download the `app-release.apk` below.
            2. Install it on your Android device (ensure "Install from unknown sources" is enabled).
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
